# Local S3-compatible object storage for development.
#
# In dev the server talks to this MinIO instance; in production the same
# StorageService points at AWS S3 by changing only the S3_* env vars (see
# sample.env). Objects (student photos, etc.) live in a PRIVATE bucket and are
# only ever reached through short-lived presigned URLs the API hands out — the
# API never proxies object bytes.
#
#   Start:   docker compose -f docker/minio/docker-compose.yml up -d
#   Console: http://localhost:9001   (login with the root creds below)
#   S3 API:  http://localhost:9000

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: nucleus-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: wait for MinIO, then create the bucket (private). Idempotent —
  # `mb --ignore-existing` is a no-op once the bucket exists.
  createbuckets:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: nucleus-minio-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER:-minioadmin}\" \"$${MINIO_ROOT_PASSWORD:-minioadmin}\";
      mc mb --ignore-existing local/$${MINIO_BUCKET:-nucleus};
      echo 'Bucket ready: '$${MINIO_BUCKET:-nucleus};
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${S3_BUCKET:-nucleus}

volumes:
  minio-data:
