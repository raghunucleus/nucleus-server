services:
  postgres:
    image: postgres:18
    container_name: nucleus-postgres
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data: